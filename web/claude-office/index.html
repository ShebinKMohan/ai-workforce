<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f9f4" />
  <title>Workforce · Local developer workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2343765c'/%3E%3Cpath d='m7 13 9-5 9 5v8l-9 5-9-5zM7 13l9 5 9-5M16 18v8' stroke='%23f8f9f4' fill='none' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/sidebar.css" />
  <link rel="stylesheet" href="/src/agent-manager.css" />
  <link rel="stylesheet" href="/src/scene-3d.css" />
  <link rel="stylesheet" href="/src/project-manager.css" />
</head>
<body>
  <header class="app-header">
    <a class="wordmark" href="/" aria-label="Workforce home"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m5 11 11-6 11 6v11l-11 6-11-6zM5 11l11 6 11-6M16 17v11M11 8l11 6v11"/></svg></span><span>Workforce</span></a>
    <span class="header-divider"></span>
    <span class="product-context">Local developer workspace</span>
    <div class="header-end"><button id="manage-projects" class="manage-agents-button">Projects</button><button id="manage-agents" class="manage-agents-button">Agents <span id="agent-count">0</span></button><button id="add-department" class="manage-agents-button">+ Department</button><button id="add-agent" class="add-agent-button"><span aria-hidden="true">+</span> Add agent</button><button id="review-button" class="review-button"><svg viewBox="0 0 20 20"><path d="m10 3 8 14H2L10 3Z"/><path d="M10 7v4m0 3v.2"/></svg><span>0 to review</span></button><button id="mobile-panel" class="icon-button mobile-panel" aria-label="Toggle control center" aria-expanded="false"><svg viewBox="0 0 20 20"><path d="M3 4h14v10H8l-4 3v-3H3Z"/></svg></button></div>
  </header>
  <main class="workspace">
    <section class="office-panel" aria-label="Office workspace">
      <div class="canvas-topbar" data-camera-ignore>
        <nav class="breadcrumbs" aria-label="Canvas navigation"><button id="office-home">Workspace</button><span>/</span><span id="selection-name">Overview</span></nav>
        <div class="view-switch" aria-label="Canvas display"><button id="office-view" class="active" aria-pressed="true"><svg viewBox="0 0 18 18"><rect x="3" y="3" width="4" height="4" rx="1"/><rect x="11" y="3" width="4" height="4" rx="1"/><rect x="3" y="11" width="4" height="4" rx="1"/><rect x="11" y="11" width="4" height="4" rx="1"/></svg>Office</button><button id="connections-view" aria-pressed="false"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="2"/><circle cx="3" cy="3" r="1.5"/><circle cx="15" cy="3" r="1.5"/><circle cx="9" cy="15" r="1.5"/><path d="m4 4 3.5 3.5m3-0L14 4M9 11v2.5"/></svg>Connections</button></div>
      </div>
      <div id="canvas" class="canvas" tabindex="0" role="region" aria-label="Interactive three dimensional office. Drag to pan, scroll to zoom, and select a department or employee."></div>
      <div class="office-overview" data-camera-ignore><span class="office-count"><strong>0</strong> agents <span class="muted">· 0 departments</span></span><span class="canvas-help">Drag to pan · Scroll to zoom</span></div>
      <div class="communication-bar" data-camera-ignore><button id="play-communication" class="communication-play" aria-label="Show recorded tasks"><svg viewBox="0 0 18 18"><path d="M3 5h12M3 9h12M3 13h8"/></svg></button><span id="communication-label">No active tasks</span><span class="sample-label">LOCAL</span></div>
      <div class="runtime-dock" data-camera-ignore><div class="dock-heading"><span class="tiny-label">LOCAL RUNTIMES</span><button id="runtime-details" aria-label="Manage local runtimes">Manage runtimes <span>↗</span></button></div><div id="runtime-buttons" class="runtime-buttons"></div></div>
      <div class="canvas-controls" data-camera-ignore><button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button><output id="zoom-value" aria-label="Canvas zoom">100%</output><button id="zoom-in" class="icon-button" aria-label="Zoom in">+</button><span class="control-separator"></span><button id="zoom-fit" class="icon-button" aria-label="Fit whole office" title="Fit whole office (0)"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button></div>
      <div id="canvas-notice" class="canvas-notice" role="status" aria-live="polite"></div>
    </section>
    <div id="panel-resizer" class="panel-resizer" role="separator" aria-label="Resize control center" aria-orientation="vertical" aria-controls="sidebar" tabindex="0" title="Drag to resize. Arrow keys adjust width; double-click to reset."></div>
    <aside id="sidebar" class="sidebar" aria-label="Control center"></aside>
    <aside id="agent-manager" hidden aria-label="Agent directory and settings"></aside>
    <aside id="department-manager" hidden aria-label="Create a department"></aside>
    <aside id="project-manager" hidden aria-label="Project setup"></aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
