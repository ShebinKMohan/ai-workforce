<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f9f4" />
  <title>Agent Office · Your team, in one place</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2343765c'/%3E%3Cpath d='m7 13 9-5 9 5v8l-9 5-9-5zM7 13l9 5 9-5M16 18v8' stroke='%23f8f9f4' fill='none' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/sidebar.css" />
  <link rel="stylesheet" href="/src/agent-manager.css" />
</head>
<body>
  <header class="app-header">
    <a class="wordmark" href="/" aria-label="Agent Office home"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m5 11 11-6 11 6v11l-11 6-11-6zM5 11l11 6 11-6M16 17v11M11 8l11 6v11"/></svg></span><span>AGENT OFFICE</span></a>
    <span class="header-divider"></span>
    <span class="office-count"><i class="dot"></i><strong>0</strong> configured agents <span class="muted">· 0 departments</span></span>
    <div class="header-end"><a class="manage-agents-button" style="color:inherit;text-decoration:none" href="/workspace/#/projects">Projects</a><button id="manage-agents" class="manage-agents-button">Agents <span id="agent-count">0</span></button><button id="add-agent" class="add-agent-button"><span aria-hidden="true">+</span> Add agent</button><button id="review-button" class="review-button"><svg viewBox="0 0 20 20"><path d="m10 3 8 14H2L10 3Z"/><path d="M10 7v4m0 3v.2"/></svg><span>0 to review</span></button><span class="profile" title="Local workspace">S</span><button id="mobile-panel" class="icon-button mobile-panel" aria-label="Toggle control center" aria-expanded="false"><svg viewBox="0 0 20 20"><path d="M3 4h14v10H8l-4 3v-3H3Z"/></svg></button></div>
  </header>
  <main class="workspace">
    <section class="office-panel" aria-label="Office workspace">
      <div class="canvas-topbar" data-camera-ignore>
        <nav class="breadcrumbs" aria-label="Canvas navigation"><button id="office-home">Workspace</button><span>/</span><span id="selection-name">Whole office</span></nav>
        <div class="view-switch" aria-label="Canvas display"><button id="office-view" class="active" aria-pressed="true"><svg viewBox="0 0 18 18"><rect x="3" y="3" width="4" height="4" rx="1"/><rect x="11" y="3" width="4" height="4" rx="1"/><rect x="3" y="11" width="4" height="4" rx="1"/><rect x="11" y="11" width="4" height="4" rx="1"/></svg>Office</button><button id="connections-view" aria-pressed="false"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="2"/><circle cx="3" cy="3" r="1.5"/><circle cx="15" cy="3" r="1.5"/><circle cx="9" cy="15" r="1.5"/><path d="m4 4 3.5 3.5m3-0L14 4M9 11v2.5"/></svg>Connections</button></div>
      </div>
      <div id="canvas" class="canvas" tabindex="0" role="region" aria-label="Interactive office canvas. Drag to pan. Pinch or Control and scroll to zoom. Select a department or employee to focus. Arrow keys pan, plus and minus zoom, zero resets.">
        <div id="world" class="world">
          <img class="office-art" src="/assets/office-clean.png" width="1402" height="1122" alt="Six pastel office islands around a central coordinator, with four stationary employees at each department's desks. Research and Engineering above, Design and Marketing at the sides, Operations and Support below." draggable="false" />
      <svg id="ui-wires" class="ui-wires" aria-hidden="true"><path id="chat-wire"/><path id="runtime-wire"/><circle id="chat-wire-start" r="3.5"/><circle id="chat-wire-end" r="4"/></svg>
          <div id="extra-desks" class="extra-desks"></div>
          <svg id="scene-lines" class="scene-lines" viewBox="0 0 1402 1122" aria-hidden="true"><g id="label-leaders"></g><g id="department-outlines"></g><g id="connection-paths"></g><g id="message-pulses"></g></svg>
          <div id="department-labels"></div>
          <div id="employee-labels"></div>
          <button id="control-label" class="control-label world-label" style="left:714px;top:416px" aria-label="Focus control center"><span class="control-symbol"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2"/><path d="M8 1v4m4-4v4M8 15v4m4-4v4M1 8h4m-4 4h4m10-4h4m-4 4h4"/></svg></span><span><strong>CONTROL CENTER</strong><small id="coordinator-name">Atlas · Office coordinator</small></span><span class="control-arrow">↗</span></button>
          <button id="control-hit" class="control-hit" aria-label="Open coordinator chat" style="left:610px;top:453px;width:210px;height:160px"></button>
        </div>
      </div>
      <div class="canvas-help" data-camera-ignore><span class="hand-icon">✥</span>Drag to explore<span class="help-divider">·</span>Click a team or employee to focus</div>
      <div class="communication-bar" data-camera-ignore><button id="play-communication" class="communication-play" aria-label="Play sample communication"><svg viewBox="0 0 18 18"><path d="m6 4 7 5-7 5V4Z"/></svg></button><span id="communication-label">Preview an agent handoff</span><span class="sample-label">DEMO</span></div>
      <div class="runtime-dock" data-camera-ignore><div class="dock-heading"><span class="tiny-label">CONTROL CENTER ROUTES TO</span><button id="runtime-details" aria-label="View model and runtime connections">View connections <span>↗</span></button></div><div id="runtime-buttons" class="runtime-buttons"></div></div>
      <div class="canvas-controls" data-camera-ignore><button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button><output id="zoom-value" aria-label="Canvas zoom">100%</output><button id="zoom-in" class="icon-button" aria-label="Zoom in">+</button><span class="control-separator"></span><button id="zoom-fit" class="icon-button" aria-label="Fit whole office" title="Fit whole office (0)"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button></div>
      <div id="canvas-notice" class="canvas-notice" role="status" aria-live="polite"></div>
    </section>
    <aside id="sidebar" class="sidebar" aria-label="Control center"></aside>
    <aside id="agent-manager" hidden aria-label="Agent directory and settings"></aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
